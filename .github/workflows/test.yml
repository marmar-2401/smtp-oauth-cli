name: Local validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native-and-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libcurl4-openssl-dev libsasl2-dev libjsoncpp-dev pkg-config shellcheck jq
      - run: curl --fail --location --proto '=https' --proto-redir '=https' https://codeload.github.com/tarickb/sasl-xoauth2/tar.gz/35c732eca1eb67de04d417e77848a3326626fab2 -o /tmp/upstream.tar.gz
      - run: sudo bash tests/run.sh /tmp/upstream.tar.gz
  el-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['8', '9', '10']
    container: almalinux:${{ matrix.version }}
    steps:
      - run: dnf install -y git dnf-plugins-core epel-release
      - run: |
          if [ '${{ matrix.version }}' = 8 ]; then
            dnf config-manager --set-enabled powertools
          else
            dnf config-manager --set-enabled crb
          fi
          dnf install -y gcc-c++ cmake make pkgconf-pkg-config libcurl-devel jsoncpp-devel cyrus-sasl-devel rpm-build /usr/bin/curl patch
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: bash packaging/build-rpm.sh /tmp/smtp-rpm-build
      - name: Verify installed package capability and integrity
        run: |
          dnf install -y /tmp/smtp-rpm-build/RPMS/*/sasl-xoauth2-m365-cli-0.28-*.rpm
          rpm -V --nomtime --noconfig sasl-xoauth2-m365-cli
          helper="$(rpm --eval '%{_libdir}')/sasl-xoauth2/test-config"
          test "$("$helper" --application-auth-capability)" = smtp-oauth-cli-client-credentials-v1
      - name: Prepare unsigned QA bundle
        run: |
          mkdir -p qa/packages qa/smtp-oauth-cli qa/packaging
          cp /tmp/smtp-rpm-build/RPMS/*/sasl-xoauth2-m365-cli-0.28-*.rpm qa/packages/
          cp /tmp/smtp-rpm-build/SRPMS/*.src.rpm qa/packages/
          cp smtp-oauth-cli/smtp-oauth-deploy.sh smtp-oauth-cli/m365-client-template.json qa/smtp-oauth-cli/
          cp README.md ADMIN.md qa/
          cp packaging/README.md qa/packaging/
          printf 'source_commit=%s\nrun_id=%s\nel_major=%s\narchitecture=%s\nunsigned_qa_only=true\nupstream_commit=35c732eca1eb67de04d417e77848a3326626fab2\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" '${{ matrix.version }}' "$(uname -m)" > qa/PROVENANCE.txt
          cd qa
          sha256sum PROVENANCE.txt README.md ADMIN.md smtp-oauth-cli/* packaging/* packages/* > SHA256SUMS
      - name: Upload unsigned QA bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa-el${{ matrix.version }}-x86_64
          path: qa/
          if-no-files-found: error
          retention-days: 30
